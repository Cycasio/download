name: Official AWS public MIMIC demo inputs
on:
  push:
    branches: [physionet-demo-fetch-20261005]
    paths: [.github/workflows/physionet-aws-public.yml]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download demo from the official open AWS bucket
        run: |
          mkdir -p export/clinical/hosp export/ecg export/packages
          python - <<'PY'
          import concurrent.futures,csv,hashlib,json,pathlib,urllib.request,xml.etree.ElementTree as ET
          base='https://physionet-open.s3.amazonaws.com/'
          root=pathlib.Path('export')
          def get(key,dest):
              dest.parent.mkdir(parents=True,exist_ok=True)
              with urllib.request.urlopen(base+key,timeout=30) as response, dest.open('wb') as out:
                  while block:=response.read(1024*1024): out.write(block)
              return {'key':key,'file':str(dest),'bytes':dest.stat().st_size,'sha256':hashlib.sha256(dest.read_bytes()).hexdigest()}
          results=[]
          for name in ['patients.csv.gz','admissions.csv.gz','diagnoses_icd.csv.gz']:
              try:
                  r=get('mimic-iv-demo/2.2/hosp/'+name,root/'clinical'/'hosp'/name)
                  results.append(r); print(json.dumps(r),flush=True)
              except Exception as e: print('CLINICAL_ERROR',name,repr(e),flush=True)
          prefix='mimic-iv-ecg-demo/0.1/'
          try:
              r=get(prefix+'record_list.csv',root/'ecg'/'record_list.csv')
              results.append(r)
              with (root/'ecg'/'record_list.csv').open() as f: records=list(csv.DictReader(f))
              targets=[prefix+'LICENSE.txt',prefix+'SHA256SUMS.txt']
              targets.extend(prefix+row['path']+ext for row in records for ext in ['.hea','.dat'])
              def dl(key):
                  r=get(key,root/'ecg'/key.removeprefix(prefix))
                  return r
              with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
                  for i,r in enumerate(pool.map(dl,targets)):
                      results.append(r)
                      if i%100==0: print('ECG_FILES',i,flush=True)
          except Exception as e: print('ECG_ERROR',repr(e),flush=True)
          (root/'manifest.json').write_text(json.dumps(results,indent=2))
          print('TOTAL_FILES',len(results),flush=True)
          PY
      - name: Download WFDB Python wheel
        run: python -m pip download --no-deps 'wfdb>=4.1,<5' -d export/packages
      - name: Retain official public inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physionet-aws-public-inputs
          path: export/
          retention-days: 1
          compression-level: 1
          if-no-files-found: error
