name: Fetch official public PhysioNet demos
on:
  push:
    branches: [physionet-demo-fetch-20261005]
    paths: [.github/workflows/physionet-demo-fetch.yml]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download public demo archives and record checksums
        shell: bash
        run: |
          mkdir -p data
          python - <<'PY'
          import hashlib, json, pathlib, time, urllib.request, zipfile
          sources = {
            'mimic-iv-demo-2.2.zip': 'https://physionet.org/content/mimic-iv-demo/get-zip/2.2/',
            'mimic-iv-ecg-demo-0.1.zip': 'https://physionet.org/content/mimic-iv-ecg-demo/get-zip/0.1/'
          }
          manifest = []
          for name, url in sources.items():
              path = pathlib.Path('data') / name
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Public-PhysioNet-Demo-Download/1.0'})
                      with urllib.request.urlopen(req, timeout=180) as response, path.open('wb') as out:
                          while block := response.read(1024*1024):
                              out.write(block)
                      with zipfile.ZipFile(path) as archive:
                          assert archive.testzip() is None
                          members = len(archive.namelist())
                      manifest.append({'file': name, 'source_url': url, 'bytes': path.stat().st_size, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest(), 'zip_members': members})
                      print(json.dumps(manifest[-1]), flush=True)
                      break
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(5)
          pathlib.Path('data/download_manifest.json').write_text(json.dumps(manifest, indent=2))
          PY
      - name: Retain public-data download artifact
        uses: actions/upload-artifact@v4
        with:
          name: physionet-public-demos
          path: data/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
