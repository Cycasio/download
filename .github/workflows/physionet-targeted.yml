name: Targeted public ECG feasibility inputs
on:
  push:
    branches: [physionet-demo-fetch-20261005]
    paths: [.github/workflows/physionet-targeted.yml]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retrieve the three small clinical tables and ECG archive
        run: |
          mkdir -p export/clinical/hosp export/packages
          python - <<'PY'
          import concurrent.futures, hashlib, json, pathlib, time, urllib.request
          root=pathlib.Path('export')
          files={
            'clinical/hosp/patients.csv.gz':'https://physionet.org/files/mimic-iv-demo/2.2/hosp/patients.csv.gz',
            'clinical/hosp/admissions.csv.gz':'https://physionet.org/files/mimic-iv-demo/2.2/hosp/admissions.csv.gz',
            'clinical/hosp/diagnoses_icd.csv.gz':'https://physionet.org/files/mimic-iv-demo/2.2/hosp/diagnoses_icd.csv.gz',
            'mimic-iv-ecg-demo-0.1.zip':'https://physionet.org/content/mimic-iv-ecg-demo/get-zip/0.1/'
          }
          def get(item):
              name,url=item
              dest=root/name
              started=time.time()
              print('START',name,flush=True)
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=120) as response, dest.open('wb') as out:
                      while block:=response.read(1024*1024): out.write(block)
                  result={'file':name,'url':url,'bytes':dest.stat().st_size,'sha256':hashlib.sha256(dest.read_bytes()).hexdigest(),'seconds':time.time()-started,'ok':True}
              except Exception as e:
                  result={'file':name,'url':url,'error':repr(e),'seconds':time.time()-started,'ok':False}
                  if dest.exists(): dest.unlink()
              print(json.dumps(result),flush=True)
              return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              manifest=list(pool.map(get,files.items()))
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2))
          PY
      - name: Obtain official WFDB Python wheel for offline cross-validation
        run: python -m pip download --no-deps 'wfdb>=4.1,<5' -d export/packages
      - name: Retain downloaded public inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physionet-targeted-public-inputs
          path: export/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
