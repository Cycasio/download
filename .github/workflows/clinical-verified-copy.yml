name: Audit verified public clinical demo
on:
  push:
    branches: [physionet-demo-fetch-20261005]
    paths: [.github/workflows/clinical-verified-copy.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Retrieve and verify the openly licensed demo
        run: |
          mkdir -p public-clinical/hosp
          python - <<'PY'
          import urllib.request,pathlib,hashlib,csv,gzip,json,re
          root=pathlib.Path('public-clinical')
          hashes={'admissions.csv.gz':'910b9f160ffdf1e08ea673585393f347c773ccc87d66875c627584a903ae8493','diagnoses_icd.csv.gz':'958565670c0b3903c0c12825366dc2bae8561d2d55f16feac0c949dd630ed3e4','patients.csv.gz':'59dcc6cd8450ddf03ad32cc7d76e41caa4c9633541715987f590c74835cf6fae'}
          tables={}; manifest=[]
          for name,expected in hashes.items():
              url='https://raw.githubusercontent.com/meghutch/mimic-ml-demo/main/data/mimic-iv-clinical-database-demo-2.2/hosp/'+name
              data=urllib.request.urlopen(url,timeout=30).read()
              actual=hashlib.sha256(data).hexdigest()
              assert actual==expected,(name,actual,expected)
              (root/'hosp'/name).write_bytes(data)
              tables[name]=list(csv.DictReader(gzip.decompress(data).decode().splitlines()))
              manifest.append({'file':name,'mirror_url':url,'official_sha256':expected,'sha256_matches':True,'bytes':len(data),'rows':len(tables[name])})
          d=tables['diagnoses_icd.csv.gz']
          def ischemic(r):
              code=r['icd_code'].strip().replace('.','')
              return code.startswith('I63') if r['icd_version']=='10' else bool(re.fullmatch(r'(433|434)\d1',code))
          strokes=[r for r in d if ischemic(r)]
          primary=[r for r in strokes if r['seq_num']=='1']
          result={'patients':len(tables['patients.csv.gz']),'admissions':len(tables['admissions.csv.gz']),'diagnosis_rows':len(d),'ischemic_stroke_patients':len({r['subject_id'] for r in strokes}),'ischemic_stroke_admissions':len({r['hadm_id'] for r in strokes}),'principal_ischemic_stroke_patients':len({r['subject_id'] for r in primary}),'principal_ischemic_stroke_admissions':len({r['hadm_id'] for r in primary}),'stroke_diagnosis_rows':strokes}
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2))
          (root/'clinical_audit.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2),flush=True)
          PY
      - name: Retain verified open demo and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-public-clinical-demo
          path: public-clinical/
          retention-days: 1
          compression-level: 0
